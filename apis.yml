aid: obot
name: Obot
description: >-
  Obot AI (formerly Acorn Labs) builds an open-source MCP Gateway and platform
  that gives organizations a central control point for Model Context Protocol
  (MCP) servers and AI agent Skills. Obot lets teams host local, remote, and
  multi-tenant MCP servers, publish an internal MCP catalog/registry, enforce
  OAuth-based access control and policy, and capture audit logs across every
  agent integration. It ships a built-in chat client with multi-model support,
  an enterprise edition with Okta and Microsoft Entra identity, and the
  companion Nanobot framework for building standalone MCP hosts. Written in Go
  and MIT-licensed, Obot self-hosts on Docker or Kubernetes.
